plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.bibleAplication.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393"

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        // ✅ Ativa suporte a Java 17
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        // ✅ Habilita o core library desugaring (necessário para flutter_local_notifications)
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            storeFile file("novo-upload.jks")
            storePassword 'Ruan#2006'
            keyAlias 'upload'
            keyPassword 'Ruan#2006'
        }
    }

    defaultConfig {
        applicationId = "com.bibleAplication.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 20
        versionName = "1.1.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.media:media:1.4.3'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // ✅ Adiciona suporte ao desugaring (necessário para notificações locais)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // (opcional, mas recomendado)
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
