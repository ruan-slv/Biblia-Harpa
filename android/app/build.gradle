plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.bibleAplication.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // Adicione a configuração de assinatura
    signingConfigs {
        release {
            // storeFile file(keystoreProperties["storeFile"]) // Substitua pelo caminho da sua keystore
            // storePassword keystoreProperties["storePassword"] // Substitua pela senha da keystore
            // keyAlias keystoreProperties["keyAlias"] // Substitua pelo alias da chave
            // keyPassword keystoreProperties["keyPassword"] // Substitua pela senha da chave
            storeFile file("/home/ruan/Documentos/Bíblia & Harpa - offline/Biblia-Harpa/upload-key.jks")
            storePassword 'none#b4fRuan'
            keyAlias 'upload'
            keyPassword 'none#b4fRuan'
        }
    }

    defaultConfig {
        applicationId = "com.bibleAplication.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 16
        versionName = "1.0.7"
    }

    buildTypes {
        release {
            // Use a configuração de assinatura de release
            signingConfig = signingConfigs.release
            minifyEnabled true // Ativa minificação para reduzir o tamanho
            shrinkResources true // Remove recursos não utilizados
        }
    }

    subprojects {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

flutter {
    source = "../.."
