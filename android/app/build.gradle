plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.appBible.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    // Adicione a configuração de assinatura
    signingConfigs {
        release {
            // storeFile file(keystoreProperties["storeFile"]) // Substitua pelo caminho da sua keystore
            // storePassword keystoreProperties["storePassword"] // Substitua pela senha da keystore
            // keyAlias keystoreProperties["keyAlias"] // Substitua pelo alias da chave
            // keyPassword keystoreProperties["keyPassword"] // Substitua pela senha da chave
            storeFile file("D:/Bible/appBible/appBible.jks")
            storePassword 'none#b4fRuan'
            keyAlias 'appBiblealias'
            keyPassword 'none#b4fRuan'
        }
    }

    defaultConfig {
        applicationId = "com.appBible.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Use a configuração de assinatura de release
            signingConfig = signingConfigs.release
            minifyEnabled true // Ativa minificação para reduzir o tamanho
            shrinkResources true // Remove recursos não utilizados
        }
    }
}

flutter {
    source = "../.."
}