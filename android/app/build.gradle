plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.bibleAplication.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393"

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // Adicione a configuração de assinatura
    signingConfigs {
        release {
            storeFile file("novo-upload.jks")
            storePassword 'Ruan#2006'
            keyAlias 'upload'
            keyPassword 'Ruan#2006'
        }
    }

    defaultConfig {
        applicationId = "com.bibleAplication.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 19
        versionName = "1.0.9"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // Use a configuração de assinatura de release
            signingConfig = signingConfigs.release
            minifyEnabled true // Ativa minificação para reduzir o tamanho
            shrinkResources true // Remove recursos não utilizados
        }
    }

    // ADICIONADO CONFORME SOLICITADO
    configurations.all {
        resolutionStrategy {
            force 'androidx.media:media:1.4.3' // Força uma versão específica e estável
        }
    }
}

flutter {
    source = "../.."
}

// A seção subprojects foi removida pois o 'configurations.all' já cobre isso de forma mais eficaz
// e para evitar redundância.
